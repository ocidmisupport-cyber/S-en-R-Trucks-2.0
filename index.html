<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S&amp;R Trucks - ICT-route</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <main class="landing-shell" aria-label="Startpagina S&amp;R Trucks">
    <button class="landing-link" id="openMenu" type="button" aria-haspopup="dialog" aria-controls="menuModal">
      <img class="landing-photo" src="S%26R.png" alt="Monteur van S&R Trucks met gereedschap in zijn borstzak">
      <span class="landing-shade" aria-hidden="true"></span>
      <span class="landing-copy">
        <span class="landing-kicker">S&amp;R Trucks</span>
        <strong>ICT-route</strong>
        <span>Klik op de foto om te beginnen.</span>
      </span>
    </button>
  </main>

  <section class="page-modal" id="menuModal" role="dialog" aria-modal="true" aria-label="Menu S&amp;R Trucks" aria-hidden="true">
    <div class="page-modal__window">
      <button class="page-modal__close" id="closeMenu" type="button" aria-label="Menu sluiten">×</button>
      <iframe class="page-modal__frame" src="menu.html" title="Menu S&amp;R Trucks"></iframe>
    </div>
  </section>

  <script>
    const modal = document.getElementById("menuModal");
    const openButton = document.getElementById("openMenu");
    const closeButton = document.getElementById("closeMenu");

    function openMenu() {
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      closeButton.focus();
    }

    function closeMenu() {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      openButton.focus();
    }

    openButton.addEventListener("click", openMenu);
    closeButton.addEventListener("click", closeMenu);
    modal.addEventListener("click", function (event) {
      if (event.target === modal) closeMenu();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && modal.classList.contains("is-open")) closeMenu();
    });
  </script>
</body>
</html>
